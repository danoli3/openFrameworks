<!doctype html>
<html lang="EN-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>openFrameworks Emscripten</title>

    <style>


        #canvas-container {
            width: 75vw;
            height: 50vh;
            margin: 20px auto;
            padding: 5px;
            border: 1px solid #444;
            background: #111;
        }

        #canvas {
            margin: 0;
            padding: 0;
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #canvas:focus {
            outline: none;
        }

        #canvas-button {
            text-align: center;
            padding: 10px 0;
        }


        #output {
            display: block;
            width: 75vw;
            max-width: 75vw;
            height: 260px;
            margin: 20px auto;
            padding: 12px;
            background: #000;
            color: #00ff9d;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.4;
            border: 1px solid #333;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            resize: vertical;
        }

        h4 {
            color: #fff;
            margin: 15px 0 5px;
        }

        small {
            color: #444;
        }
    </style>
</head>
<body>
    <h4>openFrameworks Emscripten Demo</h4>

    <div id="canvas-container">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div id="canvas-button">
        <input id="fullscreen" type="button" value="Fullscreen"
               onclick="Module.glfwRequestFullscreen ? Module.glfwRequestFullscreen('#canvas', false, true) : Module.requestFullscreen(0, true);">
    </div>

    <h4>Console Log <small></small></h4>
    <textarea id="output" readonly></textarea>

    <script>
        var Module = {
            print: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
                var output = document.getElementById('output');
                if (output) {
                    output.value += text + '\n';
                    output.scrollTop = output.scrollHeight;
                }
            },
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                var output = document.getElementById('output');
                if (output) {
                    output.value += 'ERROR: ' + text + '\n';
                    output.scrollTop = output.scrollHeight;
                }
            },

            canvas: (function() {
                return document.getElementById('canvas');
            })(),

            setStatus: function(text) {
                console.log('[status]', text);
            }
        };
    </script>

    <!-- Emscripten will replace this with the full compiled JS when you build -->
    {{{ SCRIPT }}}
</body>
</html>
